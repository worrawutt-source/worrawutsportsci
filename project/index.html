
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPORT SCIENCE RESEARCH</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}

/* กรอบครอบ Google Apps Script */
.app-wrapper {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
}

/* ซ่อนแถบด้านบนของ Google Apps Script */
.app-frame {
    position: absolute;
    top: -56px;
    left: 0;
    width: 100%;
    height: calc(100% + 56px);
    border: none;
    display: block;
}
</style>
</head>

<body>

<div class="app-wrapper">
    <iframe
        class="app-frame"
        src="https://script.google.com/macros/s/AKfycbwV6XL3kV9fP-8yZnPpb8L9wAutK_Ah2zReRbyfauJfebp44sasXmmLyGG1YczG5R9D/exec"
        allow="fullscreen"
        loading="eager">
    </iframe>
</div>

</body>
</html>
