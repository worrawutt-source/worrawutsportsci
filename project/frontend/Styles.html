<style>
:root{--navy:#17324d;--blue:#28628a;--teal:#2a8b83;--ink:#203040;--muted:#627384;--line:#dce5ed;--bg:#f3f6f9;--white:#fff;--focus:rgba(42,139,131,.18);--radius:16px;font-size:16px}
*{box-sizing:border-box}
html{min-width:320px;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Thai",Tahoma,sans-serif;color:var(--ink);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
.shell{width:min(100%,1240px);margin:0 auto;padding:24px 28px}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 0 22px;border-bottom:1px solid var(--line)}
.brand-mark{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800}
.brand-title{font-size:18px;font-weight:800;letter-spacing:.3px;color:var(--navy);line-height:1.35}.brand-sub{font-size:14px;color:var(--muted);margin-top:3px}
.env{margin-left:auto;font-size:12px;font-weight:800;letter-spacing:1px;padding:7px 12px;border-radius:20px;background:#fff1d8;color:#946200}
.auth-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(440px,480px);gap:clamp(28px,5vw,64px);align-items:center;min-height:calc(100svh - 160px);padding:28px 0}
.intro{padding:28px 12px}.eyebrow{font-size:13px;letter-spacing:1.4px;color:var(--teal);font-weight:800}
.intro h1,.welcome-row h1{font-size:clamp(32px,3vw,40px);line-height:1.4;color:var(--navy);margin:14px 0}
.intro p{font-size:18px;color:var(--muted);line-height:1.8;max-width:520px}.intro-note{margin-top:42px;color:#8b6b2b;font-size:14px;line-height:1.7}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:0 8px 28px rgba(23,50,77,.05);min-width:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 24px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:none;padding:13px 12px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;font-size:15px;min-height:48px;white-space:nowrap}
.tab.active{color:var(--blue);border-color:var(--teal)}
.form-view{display:grid;gap:18px;min-width:0}.hidden{display:none!important}
label{display:grid;gap:8px;font-size:15px;font-weight:700;color:#405365;line-height:1.5;min-width:0}
input,select,textarea{width:100%;min-width:0;min-height:48px;border:1px solid #cfdbe5;border-radius:10px;padding:12px 14px;font-size:16px;line-height:1.4;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--focus)}
input::placeholder,textarea::placeholder{color:#8795a2}button:focus-visible{outline:3px solid rgba(42,139,131,.35);outline-offset:2px}
.primary,.secondary{border-radius:10px;padding:13px 18px;font-size:16px;line-height:1.4;font-weight:700;min-height:48px}
.primary{background:var(--navy);color:#fff;border:1px solid var(--navy)}.primary:hover{background:#214563}
.secondary{background:#fff;color:var(--blue);border:1px solid #c5d4e0}.secondary:hover{background:#f3f8fb}
.otp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.message{font-size:14px;line-height:1.6;margin-top:14px;color:var(--teal);min-height:22px}
.message.error{color:#a12626;background:#fff0f0;border:1px solid #f0c4c4;border-radius:8px;padding:10px 12px}
.message.success{color:#137547;background:#eaf7ef;border:1px solid #b9e4c9;border-radius:8px;padding:10px 12px}
.welcome-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:30px 0 20px}
.welcome-row h1{font-size:30px;margin:5px 0}.welcome-row p{color:var(--muted);margin:0;font-size:16px}
.welcome-actions,.password-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.password-actions .primary{flex:1}
.dashboard-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.side-menu{background:var(--navy);border-radius:15px;padding:14px;height:max-content;display:grid;gap:6px;min-width:0}
.menu-item{border:0;background:transparent;color:#e3edf4;text-align:left;padding:13px 12px;border-radius:9px;font-size:15px;line-height:1.45;min-height:46px}
.menu-item.active,.menu-item:hover{background:#2c526f;color:#fff}
.content-area{display:grid;gap:18px;min-width:0}.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.metric-label{font-size:14px;color:var(--muted);line-height:1.5}.metric-value{font-size:30px;font-weight:800;color:var(--navy);margin-top:8px}
.content-panel h2{margin:0 0 12px;color:var(--navy);font-size:22px;line-height:1.4}.content-panel p{color:var(--muted);line-height:1.75}
.content-panel{overflow-wrap:anywhere}.notice{background:#f1f7f8;border-left:3px solid var(--teal);padding:14px 16px;color:#48646b;font-size:14px;line-height:1.7;border-radius:5px}
.admin-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;margin:14px 0}
.admin-form label{display:flex;flex-direction:column;gap:7px}.admin-form input,.admin-form select{min-width:0}
.admin-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px;border-bottom:1px solid #e5eaf0;font-size:15px}
.admin-row .admin-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}.table-wrap,.content-panel .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-weight:800;color:var(--navy);background:#f6f9fb}
footer{text-align:center;color:#8795a2;font-size:13px;padding:32px 0 12px}
@media(max-width:1100px){.shell{padding:20px 22px}.auth-grid{grid-template-columns:minmax(0,1fr) minmax(410px,460px);gap:24px}.intro{padding:20px 4px}.intro h1{font-size:34px}.dashboard-layout{grid-template-columns:205px minmax(0,1fr);gap:16px}.metric{padding:16px}}
@media(max-width:900px){.shell{padding:18px 20px}.auth-grid{grid-template-columns:minmax(0,1fr);gap:14px;min-height:auto;padding:28px 0}.intro{padding:8px 4px 12px}.intro h1{font-size:32px;margin:8px 0}.intro p{font-size:17px;margin:8px 0}.intro-note{margin-top:12px}.panel{width:100%;max-width:620px;margin:0 auto;padding:24px}.dashboard-layout{grid-template-columns:minmax(0,1fr)}.side-menu{grid-template-columns:repeat(2,minmax(0,1fr))}.menu-item{font-size:15px}.metric-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.shell{padding:12px 14px}.topbar{gap:10px;padding:8px 0 16px}.brand-mark{width:42px;height:42px;flex-basis:42px;font-size:16px}.brand-title{font-size:14px}.brand-sub{font-size:12px}.env{font-size:11px;padding:6px 9px}
.auth-grid{padding:20px 0;gap:12px}.eyebrow{font-size:12px}.intro h1{font-size:27px;line-height:1.4}.intro p{font-size:15px;line-height:1.65}.intro-note{font-size:12px}
.panel{padding:18px;border-radius:14px}.tabs{margin-bottom:18px;gap:2px}.tab{font-size:13px;padding:10px 9px;min-height:46px}.form-view{gap:15px}label{font-size:14px}
input,select,textarea{font-size:16px;min-height:48px}.primary,.secondary{font-size:15px;min-height:48px;padding:12px 14px}.otp-row{grid-template-columns:minmax(0,1fr)}
.welcome-row{align-items:flex-start;flex-direction:column;padding:22px 0 16px}.welcome-row h1{font-size:25px}.welcome-actions{width:100%}.welcome-actions button{flex:1}
.side-menu{grid-template-columns:repeat(2,minmax(0,1fr));padding:10px}.menu-item{font-size:13px;padding:10px;min-height:44px}
.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:13px}.metric-label{font-size:12px}.metric-value{font-size:25px}
.content-panel h2{font-size:19px}.admin-form{grid-template-columns:minmax(0,1fr)}.admin-row{align-items:flex-start}footer{font-size:11px;padding:24px 0 8px}}
@media(max-width:360px){.brand-title{font-size:12px}.side-menu{grid-template-columns:minmax(0,1fr)}.metric-grid{grid-template-columns:minmax(0,1fr)}.welcome-actions{flex-direction:column}.welcome-actions button{width:100%}}
@media(orientation:landscape) and (max-height:600px) and (max-width:1100px){.auth-grid{min-height:auto;padding:16px 0}.intro{padding:8px 4px}.intro h1{font-size:27px;margin:6px 0}.intro-note{margin-top:10px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}

/* Compact, responsive admin group-member picker */
.group-member-picker{display:grid;gap:10px;padding:16px!important}
.group-member-picker>label{display:block;font-weight:700;color:var(--navy);margin:2px 0 0}
.group-member-picker>select{width:100%;min-width:0}
.picker-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;color:var(--navy)}
.picker-heading span{font-size:13px;color:var(--muted);font-weight:500}
.picker-summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.picker-count{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:#eaf0f5;color:#425b70;font-size:13px;font-weight:700}
.picker-count.selected{background:#edf4f3;color:#39736d}
.picker-count.selected.has-selection{background:#d9f2e7;color:#176b4a}
.picker-search{position:relative;display:flex;align-items:center}
.picker-search-icon{position:absolute;left:13px;color:#718396;font-size:23px;line-height:1;pointer-events:none}
.picker-search input{width:100%;padding-left:40px!important;background:#fff}
.picker-toolbar{display:flex;gap:8px;flex-wrap:wrap}
.picker-toolbar button{min-height:40px;padding:8px 14px;font-size:14px}
.member-checkbox-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:300px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.member-checkbox-cell{min-width:0}
.member-checkbox-item{display:flex;align-items:center;gap:10px;min-height:58px;padding:9px 11px;border:1px solid #e4ebf1;border-radius:9px;background:#fff;cursor:pointer;transition:background .15s,border-color .15s}
.member-checkbox-item:hover{background:#f5f9fb;border-color:#b8d0dc}
.member-checkbox-item:has(input:checked){background:#edf6f5;border-color:#6fb5aa}
.member-checkbox-item input[type=checkbox]{flex:0 0 20px;width:20px;height:20px;min-height:20px;margin:0;accent-color:var(--teal)}
.member-checkbox-text{display:grid;gap:2px;min-width:0;line-height:1.4}
.member-checkbox-text strong{font-size:13px;color:var(--navy);font-weight:800;letter-spacing:.1px}
.member-checkbox-text span{font-size:14px;color:#40576a;overflow-wrap:anywhere}
.member-checkbox-cell[hidden]{display:none!important}
.picker-empty{grid-column:1/-1;margin:0;padding:14px;color:var(--muted)}
.picker-add{width:100%;margin-top:2px}
@media(max-width:900px){.member-checkbox-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:320px}}
@media(max-width:600px){.group-member-picker{padding:12px!important}.member-checkbox-list{grid-template-columns:minmax(0,1fr);max-height:360px}.member-checkbox-item{min-height:54px}.picker-toolbar button{flex:1}.picker-heading{align-items:flex-start;flex-direction:column;gap:2px}}


/* Login tabs: fit both tabs inside the panel without horizontal scrolling */
.auth-grid,.panel{min-width:0}
.tabs{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:2px;
  width:100%;
  min-width:0;
  overflow:hidden;
  overscroll-behavior-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  min-width:0;
  width:100%;
  flex:none;
  padding:clamp(8px,1.05vw,12px) 4px;
  font-size:clamp(11px,1.05vw,14px);
  line-height:1.35;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:normal;
  text-align:center;
}
@media(max-width:600px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr));gap:1px}
  .tab{padding:9px 3px;font-size:12px;min-height:44px}
}



/* Admin user management: compact role control, clear selection and bulk actions */
.user-admin-toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 14px;margin:14px 0 8px;
  background:var(--surface-soft,#f3f7f9);border:1px solid var(--border,#dbe4ee);
  border-radius:12px;
}
.user-admin-selectall{display:flex;align-items:center;gap:8px;margin-right:auto;font-weight:600}
.user-admin-selectall input,.user-row-check input{width:17px;height:17px;accent-color:var(--primary,#1b7f78);cursor:pointer}
.user-selected-count{font-size:13px;color:var(--muted,#64748b);white-space:nowrap}
.user-admin-toolbar button{padding:8px 12px;font-size:13px}
.user-admin-toolbar button:disabled{opacity:.45;cursor:not-allowed}
.user-admin-row{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid var(--border,#e3eaf0)}
.user-row-check{flex:0 0 22px;display:flex;justify-content:center}
.user-row-body{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0;flex:1}
.user-row-info{min-width:0;display:grid;gap:4px}
.user-row-primary{font-weight:650;color:var(--text,#193650);overflow-wrap:anywhere}
.user-row-secondary{font-size:13px;color:var(--muted,#64748b);overflow-wrap:anywhere}
.user-row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.user-role-label,.user-status-label{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#edf2f7;color:#475569}
.user-status-label.is-active{background:#e8f5ee;color:#187447}
.user-status-label.is-inactive{background:#fff1e8;color:#a44b16}
.user-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap;flex:0 0 auto}
.user-row-actions .user-role-select{width:112px;min-width:112px;max-width:112px;padding:8px 26px 8px 10px;font-size:13px}
.user-row-actions button{padding:8px 11px;font-size:12px;white-space:nowrap}
@media(max-width:700px){
 .user-row-body{align-items:stretch;flex-direction:column;gap:10px}
 .user-row-actions{justify-content:flex-start}
 .user-admin-toolbar{gap:8px}
 .user-selected-count{margin-right:auto}
}

</style>
