<script>
const $ = id => document.getElementById(id);
// Keep the login across tab/app switches on mobile. The server-side session still expires after APP.SESSION_HOURS.
function readStoredSessionToken(){
  try{
    let token=localStorage.getItem('ssrl_token')||'';
    if(!token){token=sessionStorage.getItem('ssrl_token')||'';if(token)localStorage.setItem('ssrl_token',token);}
    sessionStorage.removeItem('ssrl_token');
    return token;
  }catch(e){return sessionStorage.getItem('ssrl_token')||'';}
}
function storeSessionToken(token){try{localStorage.setItem('ssrl_token',token);}catch(e){sessionStorage.setItem('ssrl_token',token);}}
function clearStoredSessionToken(){try{localStorage.removeItem('ssrl_token');}catch(e){}try{sessionStorage.removeItem('ssrl_token');}catch(e){}}
let sessionToken = readStoredSessionToken();
let currentDashboard = null;

function callApi(name, ...args) {
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e))))[name](...args);
  });
}
function showMessage(message,isError=false){
  const el=$('authMessage'); el.textContent=message; el.className='message'+(isError?' error':'');
}
function showOperationStatus(message,isError=false){
  let el=$('operationStatus');
  if(!el){
    el=document.createElement('div');
    el.id='operationStatus';
    el.className='message';
    el.setAttribute('role','status');
    el.setAttribute('aria-live','polite');
    const anchor=$('appView');
    if(anchor) anchor.insertBefore(el,anchor.firstChild);
  }
  el.textContent=message;
  el.className='message'+(isError?' error':' success');
}
function setBusy(form,busy){
  form.querySelectorAll('button').forEach(b=>b.disabled=busy);
}
function switchAuthTab(tabName, message=''){
  if(!['login','register'].includes(tabName))tabName='login';
  document.querySelectorAll('.tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tabName));
  ['login','register'].forEach(k=>$(k+'Form').classList.toggle('hidden',k!==tabName));
  showMessage(message);
}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>switchAuthTab(btn.dataset.tab)));
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form = e.currentTarget; // Capture before await; event.currentTarget becomes null after dispatch.
  setBusy(form,true);
  showMessage('กำลังตรวจสอบข้อมูลเข้าสู่ระบบ...');
  try{
    const r=await callApi('apiLogin',{username:$('loginEmail').value.trim(),password:$('loginPassword').value});
    if(!r || r.ok !== true || !r.token) throw new Error('ระบบไม่ได้รับข้อมูลยืนยันการเข้าสู่ระบบ');
    sessionToken=r.token;
    storeSessionToken(sessionToken);
    await loadDashboard(r.forcePasswordChange);
  }catch(err){
    sessionToken='';
    clearStoredSessionToken();
    showMessage('เข้าสู่ระบบไม่สำเร็จ: '+(err.message||String(err)),true);
  }finally{
    setBusy(form,false); // Always re-enable the form, including after a rejected login.
  }
});
$('registerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  setBusy(form,true);
  showMessage('กำลังส่งคำขอลงทะเบียน...');
  try{const r=await callApi('apiStartStudentRegistration',{studentId:$('studentId').value,email:$('studentEmail').value,password:$('studentPassword').value});showMessage(r.message)}
  catch(err){showMessage('ลงทะเบียนไม่สำเร็จ: '+err.message,true)}
  finally{setBusy(form,false)}
});
$('verifyStudent').addEventListener('click',async()=>{
  const button=$('verifyStudent');
  const email=$('studentEmail').value.trim();
  const otp=$('studentOtp').value.trim();
  if(!email||!otp){showMessage('กรุณากรอกอีเมลและรหัส OTP ให้ครบถ้วน',true);return;}
  button.disabled=true;
  showMessage('กำลังตรวจสอบ OTP และสร้างบัญชีผู้ใช้...');
  try{
    const r=await callApi('apiVerifyStudentRegistration',{email,otp});
    if(!r||r.ok!==true) throw new Error((r&&r.message)||'เซิร์ฟเวอร์ยังไม่ยืนยันการลงทะเบียน');
    $('registerForm').reset();
    $('loginEmail').value=email;
    $('loginPassword').value='';
    switchAuthTab('login',r.message||'ลงทะเบียนสำเร็จ กรุณาเข้าสู่ระบบด้วยอีเมลและรหัสผ่านที่ตั้งไว้');
    $('loginPassword').focus();
  }catch(err){
    showMessage('ยืนยันและลงทะเบียนไม่สำเร็จ: '+(err.message||String(err)),true);
  }finally{
    button.disabled=false;
  }
});
$('logoutBtn').addEventListener('click',async()=>{
  try{await callApi('apiLogout',sessionToken)}catch(e){}
  sessionToken='';clearStoredSessionToken();$('appView').classList.add('hidden');$('authView').classList.remove('hidden');showMessage('ออกจากระบบแล้ว');
});
async function loadDashboard(forcePasswordChange, isSessionRestore=false){
  try{
    currentDashboard=await callApi('apiGetDashboard',sessionToken);
    $('authView').classList.add('hidden');$('appView').classList.remove('hidden');
    const mustChange = forcePasswordChange === true || currentDashboard.forcePasswordChange === true;
    $('passwordChangePanel').classList.toggle('hidden',!mustChange);
    $('dashboardLayout').classList.toggle('hidden',mustChange);
    if ($('changePasswordBtn')) $('changePasswordBtn').classList.toggle('hidden',mustChange);
    if ($('cancelPasswordChangeBtn')) $('cancelPasswordChangeBtn').classList.toggle('hidden',mustChange);
    $('passwordChangeTitle').textContent = mustChange ? 'ต้องเปลี่ยนรหัสผ่านก่อนใช้งาน' : 'เปลี่ยนรหัสผ่าน';
    $('passwordChangeNotice').textContent = mustChange ? 'บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณากำหนดรหัสผ่านใหม่ก่อนเข้าสู่ระบบส่วนอื่น' : 'สามารถเปลี่ยนรหัสผ่านได้จากส่วนนี้';
    $('welcomeTitle').textContent='สวัสดี, '+currentDashboard.user.displayName;
    $('welcomeSub').textContent=roleLabel(currentDashboard.user.roleId)+' · '+currentDashboard.courseCode+' · '+currentDashboard.term;
    renderDashboard(currentDashboard);
  }catch(e){
    clearStoredSessionToken();
    sessionToken='';
    $('appView').classList.add('hidden');
    $('authView').classList.remove('hidden');
    // A stale/expired token during automatic session restoration is not a login error.
    // Keep the login form clean; the user can sign in normally when ready.
    if(isSessionRestore) showMessage('');
    else showMessage(e.message||'ไม่สามารถเข้าสู่ระบบได้ กรุณาลองใหม่อีกครั้ง',true);
  }
}
function roleLabel(role){return ({ADMIN:'อาจารย์ประจำวิชา / ผู้ดูแลระบบ',ADVISOR:'Research Advisor',STUDENT:'Student',SYSTEM_ADMIN:'อาจารย์ประจำวิชา / ผู้ดูแลระบบ',RESEARCH_ADVISOR:'Research Advisor'})[role]||role}
function renderDashboard(d){
  $('sideMenu').innerHTML='';
  d.menu.forEach((label,i)=>{
    const b=document.createElement('button');b.className='menu-item'+(i===0?' active':'');b.textContent=label;
    b.addEventListener('click',async()=>{
      document.querySelectorAll('.menu-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');
      $('sectionTitle').textContent=label;$('sectionText').textContent='กำลังโหลดข้อมูล...';
      if(label==='บัญชีผู้ใช้' && currentDashboard.user.roleId==='ADMIN') await renderUserAdmin();
      else if(label==='นำเข้ารายชื่อนักศึกษา' && currentDashboard.user.roleId==='ADMIN') await renderExcelImport();
      else if(label==='บันทึกระบบ' && currentDashboard.user.roleId==='ADMIN') await renderAuditLog();
      else if(label==='จัดการกลุ่มวิจัย' && currentDashboard.user.roleId==='ADMIN') await renderGroupAdmin();
      else if(label==='กำหนดอาจารย์ที่ปรึกษา' && currentDashboard.user.roleId==='ADMIN') await renderAdvisorAssignment();
      else if(label==='บันทึกการเข้าพบ' || label==='บันทึกการพบอาจารย์') await renderMeetingAttendance();
      else if(label==='จัดการรายงานความก้าวหน้า' && currentDashboard.user.roleId==='ADMIN') await renderAdminProgressManagement();
      else if(label==='จัดการงานกลุ่ม' && currentDashboard.user.roleId==='ADMIN') await renderAdminTaskBoard();
      else if(label==='ติดตามจริยธรรม' && currentDashboard.user.roleId==='ADMIN') await renderAdminEthicsTracking();
      else if(label==='สัญญาณเตือนความเสี่ยง' && currentDashboard.user.roleId==='ADMIN') await renderAdminEarlyWarnings();
      else if(label==='งานกลุ่ม') await renderRoleTaskBoard();
      else if(label==='ประเมินผล A1–A6' && currentDashboard.user.roleId==='ADMIN') await renderAssessmentAdmin();
      else if(label==='ประเมิน A4') await renderAdvisorA4();
      else if(label==='ประเมินเพื่อน A5') await renderPeerAssessment();
      else if(label==='การตั้งค่าระบบ' && currentDashboard.user.roleId==='ADMIN') await renderSystemSettings();
      else if(label==='กลุ่มที่ได้รับมอบหมาย') await renderAdvisorGroups();
      else if(label==='พื้นที่ทำงานกลุ่ม') await renderStudentWorkspace();
      else if(label==='หัวข้อวิจัย') await renderStudentTopics();
      else if(label==='เอกสารโครงร่าง') await renderProposalDocuments();
      else if(label==='ความก้าวหน้า') await renderProgressReports();
      else if(label==='ข้อเสนอแนะ') await renderFeedback();
      else if(label==='ผลการประเมิน' && currentDashboard.user.roleId==='STUDENT') await renderStudentGrades();
      else if(label==='ตรวจหัวข้อและให้ข้อเสนอแนะ') await renderAdvisorReview();
      else if(label==='ภาพรวมระบบ' || label==='ภาพรวมการให้คำปรึกษ') await renderOverview();
      else $('sectionText').textContent='เมนูนี้ยังไม่มีสิทธิ์หรือไม่มีข้อมูลสำหรับบัญชีนี้';
    });
    $('sideMenu').appendChild(b);
  });
  const metrics=Object.entries(d.metrics||{});
  $('metricGrid').innerHTML='';
  metrics.forEach(([k,v])=>{
    const card=document.createElement('div');card.className='metric';
    const label=document.createElement('div');label.className='metric-label';label.textContent=metricLabel(k);
    const value=document.createElement('div');value.className='metric-value';value.textContent=String(v);
    card.append(label,value);$('metricGrid').appendChild(card);
  });
}
async function renderUserAdmin(){
  const area=$('sectionText');area.textContent='กำลังโหลดบัญชีผู้ใช้...';
  try{
    const users=await callApi('apiListUsers',sessionToken);
    area.textContent='';
    const invite=document.createElement('form');invite.className='admin-form';
    const nameLabel=document.createElement('label');nameLabel.textContent='ชื่ออาจารย์ที่ปรึกษา';
    const nameInput=document.createElement('input');nameInput.required=true;nameInput.maxLength=150;nameLabel.appendChild(nameInput);
    const emailLabel=document.createElement('label');emailLabel.textContent='อีเมล';
    const emailInput=document.createElement('input');emailInput.type='email';emailInput.required=true;emailLabel.appendChild(emailInput);
    const inviteBtn=document.createElement('button');inviteBtn.type='submit';inviteBtn.className='primary';inviteBtn.textContent='ส่งคำเชิญ Advisor';
    const inviteStatus=document.createElement('div');inviteStatus.className='message';inviteStatus.setAttribute('aria-live','polite');
    invite.append(nameLabel,emailLabel,inviteBtn);area.append(invite,inviteStatus);
    invite.addEventListener('submit',async e=>{
      e.preventDefault();inviteBtn.disabled=true;inviteStatus.textContent='กำลังส่งคำเชิญ...';inviteStatus.className='message';
      try{const r=await callApi('apiCreateInvitation',sessionToken,{email:emailInput.value.trim(),displayName:nameInput.value.trim(),roleId:'ADVISOR'});inviteStatus.textContent=r.message||'ส่งคำเชิญสำเร็จ';inviteStatus.className='message success';invite.reset();}
      catch(err){inviteStatus.textContent='ส่งคำเชิญไม่สำเร็จ: '+err.message;inviteStatus.className='message error';}
      finally{inviteBtn.disabled=false;}
    });

    const toolbar=document.createElement('div');toolbar.className='user-admin-toolbar';
    const left=document.createElement('div');left.className='user-admin-selectall';
    const selectAll=document.createElement('input');selectAll.type='checkbox';selectAll.id='userSelectAll';
    const selectLabel=document.createElement('label');selectLabel.htmlFor='userSelectAll';selectLabel.textContent='เลือกทั้งหมด';
    left.append(selectAll,selectLabel);
    const count=document.createElement('span');count.className='user-selected-count';count.textContent='เลือก 0 บัญชี';
    const bulkSuspend=document.createElement('button');bulkSuspend.type='button';bulkSuspend.className='secondary';bulkSuspend.textContent='ปิดใช้งานที่เลือก';bulkSuspend.disabled=true;
    const bulkActivate=document.createElement('button');bulkActivate.type='button';bulkActivate.className='secondary';bulkActivate.textContent='เปิดใช้งานที่เลือก';bulkActivate.disabled=true;
    toolbar.append(left,count,bulkSuspend,bulkActivate);area.appendChild(toolbar);

    const list=document.createElement('div');list.className='user-admin-list';
    const selected=new Set();
    const checks=[];
    const refreshSelection=()=>{
      count.textContent='เลือก '+selected.size+' บัญชี';
      bulkSuspend.disabled=selected.size===0;
      bulkActivate.disabled=selected.size===0;
      selectAll.checked=checks.length>0&&checks.every(x=>x.checked);
      selectAll.indeterminate=checks.some(x=>x.checked)&&!selectAll.checked;
    };
    selectAll.addEventListener('change',()=>{
      checks.forEach(c=>{c.checked=selectAll.checked;if(c.checked)selected.add(c.dataset.userId);else selected.delete(c.dataset.userId);});
      refreshSelection();
    });
    const runBulk=async status=>{
      const ids=[...selected];
      if(!ids.length)return;
      const action=status==='SUSPENDED'?'ปิดใช้งาน':'เปิดใช้งาน';
      if(!confirm('ยืนยัน'+action+'บัญชี '+ids.length+' รายการ?\\nข้อมูลประวัติเดิมจะยังคงอยู่ในระบบ'))return;
      bulkSuspend.disabled=bulkActivate.disabled=true;
      try{const r=await callApi('apiAdminBulkSetUserStatus',sessionToken,ids,status);showOperationStatus(r.message||'ดำเนินการสำเร็จ');await renderUserAdmin();}
      catch(err){showOperationStatus(action+'ไม่สำเร็จ: '+err.message,true);bulkSuspend.disabled=bulkActivate.disabled=false;}
    };
    bulkSuspend.addEventListener('click',()=>runBulk('SUSPENDED'));
    bulkActivate.addEventListener('click',()=>runBulk('ACTIVE'));

    users.forEach(u=>{
      const row=document.createElement('div');row.className='admin-row user-admin-row';
      const checkWrap=document.createElement('div');checkWrap.className='user-row-check';
      const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','เลือกบัญชี '+(u.displayName||u.email));check.dataset.userId=u.userId;
      check.addEventListener('change',()=>{if(check.checked)selected.add(u.userId);else selected.delete(u.userId);refreshSelection();});
      checks.push(check);checkWrap.appendChild(check);
      const body=document.createElement('div');body.className='user-row-body';
      const info=document.createElement('div');info.className='user-row-info';
      const primary=document.createElement('div');primary.className='user-row-primary';primary.textContent=(u.displayName||u.username||u.email||'-');
      const secondary=document.createElement('div');secondary.className='user-row-secondary';secondary.textContent=(u.email||u.username||'-')+(u.studentId?' · '+u.studentId:'');
      const meta=document.createElement('div');meta.className='user-row-meta';
      const roleBadge=document.createElement('span');roleBadge.className='user-role-label';roleBadge.textContent=roleLabel(u.roleId);
      const statusBadge=document.createElement('span');statusBadge.className='user-status-label '+(u.status==='ACTIVE'?'is-active':'is-inactive');statusBadge.textContent=u.status==='ACTIVE'?'ใช้งาน':'ปิดใช้งาน';
      meta.append(roleBadge,statusBadge);info.append(primary,secondary,meta);
      const actions=document.createElement('div');actions.className='user-row-actions';
      const roleSelect=document.createElement('select');roleSelect.className='user-role-select';roleSelect.setAttribute('aria-label','เปลี่ยนบทบาท');
      [['ADMIN','Admin'],['ADVISOR','Advisor'],['STUDENT','Student']].forEach(([v,l])=>{const op=document.createElement('option');op.value=v;op.textContent=l;roleSelect.appendChild(op);});
      roleSelect.value=u.roleId;
      roleSelect.addEventListener('change',async()=>{const old=u.roleId;roleSelect.disabled=true;try{const r=await callApi('apiSetUserRole',sessionToken,u.userId,roleSelect.value);showOperationStatus(r.message||'ปรับสิทธิ์สำเร็จ');await renderUserAdmin();}catch(err){roleSelect.value=old;showOperationStatus('ปรับสิทธิ์ไม่สำเร็จ: '+err.message,true);}finally{roleSelect.disabled=false;}});
      actions.appendChild(roleSelect);
      if(u.userId!==currentDashboard.user.userId){
        const reset=document.createElement('button');reset.type='button';reset.className='secondary';reset.textContent='Reset รหัสผ่าน';
        reset.addEventListener('click',async()=>{if(!confirm('ยืนยันรีเซ็ตรหัสผ่านของ '+(u.displayName||u.email)+' เป็น 123456?'))return;reset.disabled=true;try{const r=await callApi('apiAdminResetPassword',sessionToken,u.userId);showOperationStatus(r.message||'รีเซ็ตรหัสผ่านสำเร็จ');reset.textContent='รีเซ็ตแล้ว';}catch(err){showOperationStatus('รีเซ็ตรหัสผ่านไม่สำเร็จ: '+err.message,true);reset.disabled=false;}});
        actions.appendChild(reset);
        const statusBtn=document.createElement('button');statusBtn.type='button';statusBtn.className='secondary user-status-action';statusBtn.textContent=u.status==='ACTIVE'?'ปิดใช้งาน':'เปิดใช้งาน';
        statusBtn.addEventListener('click',async()=>{const next=u.status==='ACTIVE'?'SUSPENDED':'ACTIVE';if(!confirm((next==='SUSPENDED'?'ปิดใช้งาน':'เปิดใช้งาน')+'บัญชี '+(u.displayName||u.email)+'? ประวัติเดิมจะไม่ถูกลบ'))return;statusBtn.disabled=true;try{const r=await callApi('apiSetUserStatus',sessionToken,u.userId,next);showOperationStatus(r.message||'ปรับสถานะบัญชีสำเร็จ');await renderUserAdmin();}catch(err){showOperationStatus('ปรับสถานะไม่สำเร็จ: '+err.message,true);statusBtn.disabled=false;}});
        actions.appendChild(statusBtn);
      }
      body.append(info,actions);row.append(checkWrap,body);list.appendChild(row);
    });
    area.appendChild(list);refreshSelection();
  }catch(err){area.textContent='โหลดบัญชีผู้ใช้ไม่สำเร็จ: '+err.message;}
}
async function renderAuditLog(){
  const area=$('sectionText'); area.textContent='กำลังโหลดบันทึกระบบ...';
  try{
    const logs=await callApi('apiGetAuditLog',sessionToken); area.textContent='';
    if(!logs.length){area.textContent='ยังไม่มีบันทึกระบบ';return;}
    const list=document.createElement('div');list.className='user-admin-list';
    logs.forEach(l=>{const row=document.createElement('div');row.className='admin-row';row.textContent='['+new Date(l.createdAt).toLocaleString('th-TH')+'] '+l.action+' · '+l.targetType+' ('+l.targetId+') · ผู้ดำเนินการ: '+l.actorUserId;list.appendChild(row);});
    area.appendChild(list);
  }catch(err){area.textContent='โหลดบันทึกระบบไม่สำเร็จ: '+err.message;}
}

async function renderExcelImport(){
  const area=$('sectionText'); area.textContent='';
  const box=document.createElement('div'); box.className='notice';
  const label=document.createElement('label'); label.textContent='Google Drive File ID ของไฟล์ Excel (.xlsx)';
  const input=document.createElement('input'); input.type='text'; input.placeholder='วาง File ID ของไฟล์ Excel';
  const sheetLabel=document.createElement('label'); sheetLabel.textContent='ชื่อ Sheet (เว้นว่างเพื่อใช้แท็บแรก)';
  const sheetInput=document.createElement('input'); sheetInput.type='text'; sheetInput.placeholder='เช่น students-4084901-sect-01';
  const btn=document.createElement('button'); btn.type='button'; btn.className='primary'; btn.textContent='นำเข้า Excel';
  const result=document.createElement('p');
  btn.addEventListener('click',async()=>{
    btn.disabled=true; result.textContent='กำลังนำเข้า...';
    try{
      const r=await callApi('apiAdminImportStudentRosterFromExcel',sessionToken,input.value.trim(),sheetInput.value.trim());
      result.textContent='นำเข้าสำเร็จ: '+r.imported+' คน, มีอยู่แล้ว '+r.alreadyPresent+' คน, รวม '+r.total+' คน';
    }catch(e){result.textContent='นำเข้าไม่สำเร็จ: '+e.message;}
    finally{btn.disabled=false;}
  });
  box.append(label,input,sheetLabel,sheetInput,btn,result); area.appendChild(box);
}
function metricLabel(k){return ({users:'บัญชีผู้ใช้ทั้งหมด',sessions:'Session ที่ยังใช้งาน',roster:'นักศึกษาในทะเบียน',students:'นักศึกษาในทะเบียน',registered:'ลงทะเบียนแล้ว',advisors:'อาจารย์ที่ปรึกษา',assignedGroups:'กลุ่มที่ได้รับมอบหมาย',pendingReviews:'งานรอตรวจ',reportsAvailable:'รายงานความก้าวหน้าที่ส่งแล้ว',feedbackProvided:'ข้อเสนอแนะที่บันทึกแล้ว',meetings:'การนัดหมาย',groupStatus:'สถานะกลุ่ม',milestones:'กิจกรรมและเป้าหมายรายสัปดาห์',feedback:'ข้อเสนอแนะ'})[k]||k}

 }catch(e){a.textContent='โหลดพื้นที่ทำงานกลุ่มไม่สำเร็จ: '+e.message;}
}

// Password panel supports both forced first-login change and voluntary change from Dashboard.
const changePasswordShortcut=$('changePasswordBtn');
if(changePasswordShortcut) changePasswordShortcut.addEventListener('click',()=>{
  $('passwordChangePanel').classList.remove('hidden');
  $('passwordChangeTitle').textContent='เปลี่ยนรหัสผ่าน';
  $('passwordChangeNotice').textContent='กรอกรหัสผ่านปัจจุบันและกำหนดรหัสผ่านใหม่';
  $('cancelPasswordChangeBtn').classList.remove('hidden');
  $('passwordChangePanel').scrollIntoView({behavior:'smooth',block:'center'});
});
const cancelPasswordChangeBtn=$('cancelPasswordChangeBtn');
if(cancelPasswordChangeBtn) cancelPasswordChangeBtn.addEventListener('click',()=>{
  $('passwordChangeForm').reset(); $('passwordMessage').textContent='';
  $('passwordChangePanel').classList.add('hidden');
});
async function submitPasswordChange(event){
  event.preventDefault(); event.stopPropagation();
  const form=$('passwordChangeForm'), btn=$('saveNewPasswordBtn'), msg=$('passwordMessage');
  const current=$('currentPassword').value, next=$('newPassword').value, confirmValue=$('confirmPassword').value;
  msg.textContent='';msg.className='message';
  if(!current||!next||!confirmValue){msg.textContent='กรุณากรอกข้อมูลให้ครบทุกช่อง';msg.className='message error';return;}
  if(next.length<6||!/[\p{L}]/u.test(next)||!/[0-9]/.test(next)||! /[^\p{L}0-9]/u.test(next)){msg.textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร และประกอบด้วยตัวอักษร ตัวเลข และอักขระพิเศษ';msg.className='message error';return;}
  if(next!==confirmValue){msg.textContent='รหัสผ่านใหม่ไม่ตรงกัน';msg.className='message error';return;}
  setBusy(form,true);btn.textContent='กำลังบันทึกรหัสผ่าน...';msg.textContent='กำลังตรวจสอบและบันทึกรหัสผ่าน...';
  try{
    const result=await callApi('apiChangePassword',sessionToken,current,next);
    if(!result||result.ok!==true||result.passwordChangeRequired!==false)throw new Error((result&&result.message)||'เซิร์ฟเวอร์ยังไม่ยืนยันการบันทึก');
    msg.textContent='บันทึกรหัสผ่านใหม่สำเร็จ';msg.className='message success';
    showOperationStatus('สำเร็จ: บันทึกรหัสผ่านใหม่แล้ว');
    $('passwordChangeForm').reset();
    try{
      const fresh=await callApi('apiGetDashboard',sessionToken);
      if(fresh.forcePasswordChange===true)throw new Error('บัญชียังมีสถานะบังคับเปลี่ยนรหัสผ่าน');
      currentDashboard=fresh;$('passwordChangePanel').classList.add('hidden');$('dashboardLayout').classList.remove('hidden');
      $('changePasswordBtn').classList.remove('hidden');renderDashboard(fresh);
      showOperationStatus('สำเร็จ: เปลี่ยนรหัสผ่านและเปิด Dashboard แล้ว');
    }catch(refreshErr){
      msg.textContent='บันทึกรหัสผ่านสำเร็จ แต่โหลด Dashboard ไม่สำเร็จ: '+refreshErr.message+' กรุณาออกจากระบบแล้วเข้าสู่ระบบใหม่ด้วยรหัสผ่านใหม่';
      msg.className='message success';showOperationStatus('บันทึกรหัสผ่านแล้ว แต่โหลด Dashboard ไม่สำเร็จ',true);
    }
  }catch(err){msg.textContent='บันทึกรหัสผ่านไม่สำเร็จ: '+err.message;msg.className='message error';showOperationStatus('ไม่สำเร็จ: '+err.message,true);}
  finally{setBusy(form,false);btn.textContent='บันทึกรหัสผ่านใหม่';}
}
const passwordChangeForm=$('passwordChangeForm');
if(passwordChangeForm)passwordChangeForm.addEventListener('submit',submitPasswordChange);
if(window.SSRL_MAGIC_SESSION){sessionToken=window.SSRL_MAGIC_SESSION;storeSessionToken(sessionToken);loadDashboard(undefined,true);}
else if(sessionToken)loadDashboard(undefined,true);
</script>
