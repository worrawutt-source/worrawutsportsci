<script>
const $ = id => document.getElementById(id);
// Keep the login across tab/app switches on mobile. The server-side session still expires after APP.SESSION_HOURS.
function readStoredSessionToken(){
  try{
    let token=localStorage.getItem('ssrl_token')||'';
    if(!token){token=sessionStorage.getItem('ssrl_token')||'';if(token)localStorage.setItem('ssrl_token',token);}
    sessionStorage.removeItem('ssrl_token');
    return token;
  }catch(e){return sessionStorage.getItem('ssrl_token')||'';}
}
function storeSessionToken(token,expiresAt){
  try{localStorage.setItem('ssrl_token',token);if(expiresAt)localStorage.setItem('ssrl_expires_at',expiresAt);}
  catch(e){sessionStorage.setItem('ssrl_token',token);if(expiresAt)sessionStorage.setItem('ssrl_expires_at',expiresAt);}
  if(expiresAt)scheduleSessionExpiry(expiresAt);
}
function clearStoredSessionToken(){
  try{localStorage.removeItem('ssrl_token');localStorage.removeItem('ssrl_expires_at');}catch(e){}
  try{sessionStorage.removeItem('ssrl_token');sessionStorage.removeItem('ssrl_expires_at');}catch(e){}
  if(sessionExpiryTimer)clearTimeout(sessionExpiryTimer);
  sessionExpiryTimer=null;
}
let sessionToken = readStoredSessionToken();
let currentDashboard = null;
// Serialize asynchronous menu renderers so a slow previous API response cannot overwrite the latest selected page.
let menuRenderQueue = Promise.resolve();
let activeMenuRequestId = 0;
let dashboardLoadRequestId = 0;
const ACTIVE_MENU_STORAGE_KEY='ssrl_active_menu';
function getSavedActiveMenu(){try{return localStorage.getItem(ACTIVE_MENU_STORAGE_KEY)||'';}catch(e){return '';}}
function saveActiveMenu(label){try{localStorage.setItem(ACTIVE_MENU_STORAGE_KEY,String(label||''));}catch(e){}}
function clearSavedActiveMenu(){try{localStorage.removeItem(ACTIVE_MENU_STORAGE_KEY);}catch(e){}}

function callApi(name, ...args) {
  return new Promise((resolve,reject)=>{
    google.script.run
      .withSuccessHandler(result=>{
        resolve(result);
        const isReadOnly=/^api(?:Admin|Advisor|Student)?(?:Get|List|Search|Check|Load|Fetch|Preview|Calculate|Download|Export|Lookup|Validate)/.test(name);
        if(!isReadOnly&&currentDashboard&&sessionToken&&name!=='apiGetMenuTaskCounts')scheduleMenuTaskIndicatorRefresh_();
      })
      .withFailureHandler(e=>{
        const message=(e && e.message) ? e.message : String(e);
        if(sessionToken && name!=='apiLogin' && name!=='apiStartStudentRegistration' && name!=='apiVerifyStudentRegistration' && isInvalidSessionError(message)){
          handleInvalidSession(message);
        }
        reject(new Error(message));
      })[name](...args);
  });
}
function isInvalidSessionError(message){
  return /Session\s+หมดอายุ|Session.*ถูกยกเลิก|กรุณาเข้าสู่ระบบใหม่|บัญชีถูกระงับหรือไม่พบผู้ใช้/i.test(String(message||''));
}
let sessionExpiryTimer=null;
function scheduleSessionExpiry(expiresAt){
  if(sessionExpiryTimer) clearTimeout(sessionExpiryTimer);
  sessionExpiryTimer=null;
  const timestamp=Date.parse(expiresAt||'');
  if(!Number.isFinite(timestamp)) return;
  try{localStorage.setItem('ssrl_expires_at',new Date(timestamp).toISOString());}catch(e){}
  const remaining=timestamp-Date.now();
  if(remaining<=0){handleInvalidSession('Session หมดอายุ');return;}
  sessionExpiryTimer=setTimeout(()=>{
    handleInvalidSession('Session หมดอายุ');
  },Math.min(remaining,2147480000));
}
function handleInvalidSession(reason){
  if(sessionExpiryTimer) clearTimeout(sessionExpiryTimer);
  sessionExpiryTimer=null;
  sessionToken='';
  currentDashboard=null;
  clearStoredSessionToken();
  const app=$('appView'),auth=$('authView');
  document.documentElement.classList.remove('ssrl-session-restoring');
  const restore=$('sessionRestoreView');if(restore)restore.classList.add('hidden');
  if(app) app.classList.add('hidden');
  if(auth) auth.classList.remove('hidden');
  const message=/หมดอายุ/.test(String(reason||''))?'Session หมดอายุ กรุณาเข้าสู่ระบบใหม่':'Session ถูกยกเลิกหรือบัญชีไม่สามารถใช้งานได้ กรุณาเข้าสู่ระบบใหม่';
  showMessage(message,true);
}
function showMessage(message,isError=false){
  const el=$('authMessage'); el.textContent=message; el.className='message'+(isError?' error':'');
}
function showOperationStatus(message,isError=false){
  let el=$('operationStatus');
  if(!el){
    el=document.createElement('div');
    el.id='operationStatus';
    el.className='message';
    el.setAttribute('role','status');
    el.setAttribute('aria-live','polite');
    const anchor=$('appView');
    if(anchor) anchor.insertBefore(el,anchor.firstChild);
  }
  el.textContent=message;
  el.className='message'+(isError?' error':' success');
}
function setBusy(form,busy){
  form.querySelectorAll('button').forEach(b=>b.disabled=busy);
}
function switchAuthTab(tabName, message=''){
  if(!['login','register'].includes(tabName))tabName='login';
  document.querySelectorAll('.tab').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tabName));
  ['login','register'].forEach(k=>$(k+'Form').classList.toggle('hidden',k!==tabName));
  showMessage(message);
}
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>switchAuthTab(btn.dataset.tab)));
$('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form = e.currentTarget; // Capture before await; event.currentTarget becomes null after dispatch.
  setBusy(form,true);
  showMessage('กำลังตรวจสอบข้อมูลเข้าสู่ระบบ...');
  try{
    const r=await callApi('apiLogin',{username:$('loginEmail').value.trim(),password:$('loginPassword').value});
    if(!r || r.ok !== true || !r.token) throw new Error('ระบบไม่ได้รับข้อมูลยืนยันการเข้าสู่ระบบ');
    sessionToken=r.token;
    storeSessionToken(sessionToken);
    await loadDashboard(r.forcePasswordChange);
  }catch(err){
    sessionToken='';
    clearStoredSessionToken();
    showMessage('เข้าสู่ระบบไม่สำเร็จ: '+(err.message||String(err)),true);
  }finally{
    setBusy(form,false); // Always re-enable the form, including after a rejected login.
  }
});
$('registerForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.currentTarget;
  setBusy(form,true);
  showMessage('กำลังส่งคำขอลงทะเบียน...');
  try{const r=await callApi('apiStartStudentRegistration',{studentId:$('studentId').value,email:$('studentEmail').value,password:$('studentPassword').value});showMessage(r.message)}
  catch(err){showMessage('ลงทะเบียนไม่สำเร็จ: '+err.message,true)}
  finally{setBusy(form,false)}
});
$('verifyStudent').addEventListener('click',async()=>{
  const button=$('verifyStudent');
  const email=$('studentEmail').value.trim();
  const otp=$('studentOtp').value.trim();
  if(!email||!otp){showMessage('กรุณากรอกอีเมลและรหัส OTP ให้ครบถ้วน',true);return;}
  button.disabled=true;
  showMessage('กำลังตรวจสอบ OTP และสร้างบัญชีผู้ใช้...');
  try{
    const r=await callApi('apiVerifyStudentRegistration',{email,otp});
    if(!r||r.ok!==true) throw new Error((r&&r.message)||'เซิร์ฟเวอร์ยังไม่ยืนยันการลงทะเบียน');
    $('registerForm').reset();
    $('loginEmail').value=email;
    $('loginPassword').value='';
    switchAuthTab('login',r.message||'ลงทะเบียนสำเร็จ กรุณาเข้าสู่ระบบด้วยอีเมลและรหัสผ่านที่ตั้งไว้');
    $('loginPassword').focus();
  }catch(err){
    showMessage('ยืนยันและลงทะเบียนไม่สำเร็จ: '+(err.message||String(err)),true);
  }finally{
    button.disabled=false;
  }
});
$('logoutBtn').addEventListener('click',async()=>{
  try{await callApi('apiLogout',sessionToken)}catch(e){}
  sessionToken='';clearStoredSessionToken();clearSavedActiveMenu();document.documentElement.classList.remove('ssrl-session-restoring');$('appView').classList.add('hidden');$('authView').classList.remove('hidden');showMessage('ออกจากระบบแล้ว');
});
async function loadDashboard(forcePasswordChange, isSessionRestore=false){
  const requestId=++dashboardLoadRequestId;
  try{
    const dashboard=await callApi('apiGetDashboard',sessionToken);
    if(requestId!==dashboardLoadRequestId)return;
    currentDashboard=dashboard;
    document.documentElement.classList.remove('ssrl-session-restoring');
    if(currentDashboard && currentDashboard.expiresAt) scheduleSessionExpiry(currentDashboard.expiresAt);
    $('authView').classList.add('hidden');$('appView').classList.remove('hidden');
    const mustChange = forcePasswordChange === true || currentDashboard.forcePasswordChange === true;
    $('passwordChangePanel').classList.toggle('hidden',!mustChange);
    $('dashboardLayout').classList.toggle('hidden',mustChange);
    if ($('changePasswordBtn')) $('changePasswordBtn').classList.toggle('hidden',mustChange);
    if ($('cancelPasswordChangeBtn')) $('cancelPasswordChangeBtn').classList.toggle('hidden',mustChange);
    $('passwordChangeTitle').textContent = mustChange ? 'ต้องเปลี่ยนรหัสผ่านก่อนใช้งาน' : 'เปลี่ยนรหัสผ่าน';
    $('passwordChangeNotice').textContent = mustChange ? 'บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณากำหนดรหัสผ่านใหม่ก่อนเข้าสู่ระบบส่วนอื่น' : 'สามารถเปลี่ยนรหัสผ่านได้จากส่วนนี้';
    $('welcomeTitle').textContent='สวัสดี, '+currentDashboard.user.displayName;
    $('welcomeSub').textContent=roleLabel(currentDashboard.user.roleId)+' · '+currentDashboard.courseCode+' · '+currentDashboard.term;
    renderDashboard(currentDashboard);
  }catch(e){
    if(requestId!==dashboardLoadRequestId)return;
    document.documentElement.classList.remove('ssrl-session-restoring');
    $('sessionRestoreView')?.classList.add('hidden');
    $('appView').classList.add('hidden');
    $('authView').classList.remove('hidden');
    if(isInvalidSessionError(e.message)){
      handleInvalidSession(e.message);
    }else if(isSessionRestore){
      // Preserve the token after transient transport/server failures so refresh can retry.
      showMessage('ไม่สามารถตรวจสอบ Session ได้ในขณะนี้ กรุณาลองรีเฟรชหน้าเว็บอีกครั้ง',true);
    }else{
      showMessage(e.message||'ไม่สามารถเข้าสู่ระบบได้ กรุณาลองใหม่อีกครั้ง',true);
    }
  }
}
function roleLabel(role){return ({ADMIN:'อาจารย์ประจำวิชา / ผู้ดูแลระบบ',ADVISOR:'Research Advisor',STUDENT:'Student',SYSTEM_ADMIN:'อาจารย์ประจำวิชา / ผู้ดูแลระบบ',RESEARCH_ADVISOR:'Research Advisor'})[role]||role}
function normalizeMenuLabel_(value){
  return String(value||'').normalize('NFC').replace(/[\u200B-\u200D\uFEFF\u00A0]/g,' ').replace(/\s+/g,' ').trim();
}

function createProgressBadge_(count,description){
 const exact=Number(count)||0,display=exact>99?'99+':String(exact);
 const badge=document.createElement('span');badge.className='progress-task-badge';badge.textContent=display;badge.title=description||('มีงานค้าง '+exact+' รายการ');badge.setAttribute('aria-label',badge.title);return badge;
}
function setMenuTaskCount_(label,count,description){
 const wanted=normalizeMenuLabel_(label);
 const item=[...$('sideMenu').querySelectorAll('.menu-item')].find(x=>normalizeMenuLabel_(x.dataset.menuLabel)===wanted);
 if(!item)return;
 const old=item.querySelector('.progress-task-badge');if(old)old.remove();
 const n=Math.max(0,Number(count)||0);if(n>0)item.append(createProgressBadge_(n,description||('มีงานค้าง '+n+' รายการในเมนู '+label)));
}
let menuTaskIndicatorRefreshTimer_=null;
function scheduleMenuTaskIndicatorRefresh_(){
 if(!currentDashboard||!sessionToken)return;
 if(menuTaskIndicatorRefreshTimer_)clearTimeout(menuTaskIndicatorRefreshTimer_);
 menuTaskIndicatorRefreshTimer_=setTimeout(()=>{menuTaskIndicatorRefreshTimer_=null;refreshMenuTaskIndicators_();},250);
}
async function refreshMenuTaskIndicators_(){
 if(!currentDashboard||!sessionToken||!document.querySelector('#sideMenu .menu-item'))return;
 try{
  const counts=await callApi('apiGetMenuTaskCounts',sessionToken);
  document.querySelectorAll('#sideMenu .menu-item .progress-task-badge').forEach(x=>x.remove());
  const role=currentDashboard.user.roleId;
  if(role==='ADMIN'){
   const c=counts.admin||{};
   setMenuTaskCount_('จัดการกลุ่มวิจัย',c.groupsNeedsLeader,'กลุ่มที่ยังไม่ได้กำหนดหัวหน้ากลุ่ม '+(c.groupsNeedsLeader||0)+' กลุ่ม');
   setMenuTaskCount_('กำหนดอาจารย์ที่ปรึกษา',c.advisorAssignment,'กลุ่มที่รอแต่งตั้ง/ยืนยันอาจารย์ที่ปรึกษา '+(c.advisorAssignment||0)+' กลุ่ม');
   setMenuTaskCount_('จัดการรายงานความก้าวหน้า',c.progressManagement,'รายงานความก้าวหน้าที่รอตรวจ '+(c.progressManagement||0)+' รายงาน');
   setMenuTaskCount_('จัดการงานกลุ่ม',c.taskBoard,'งานกลุ่มที่ยังไม่เสร็จ '+(c.taskBoard||0)+' รายการ');
   setMenuTaskCount_('ติดตามจริยธรรม',c.ethics,'กลุ่มที่ยังไม่ได้กำหนดแผนจริยธรรม '+(c.ethics||0)+' กลุ่ม');
   setMenuTaskCount_('สัญญาณเตือนความเสี่ยง',c.risk,'สัญญาณเตือนที่ยังไม่ปิด '+(c.risk||0)+' รายการ');
   setMenuTaskCount_('ประเมินผล A1–A6',c.assessment,'กลุ่มที่คะแนน A1–A4 ยังไม่ครบ '+(c.assessment||0)+' กลุ่ม');
   setMenuTaskCount_('บัญชีผู้ใช้',c.users,'คำเชิญบัญชีที่ยังดำเนินการ '+(c.users||0)+' รายการ');
  }else if(role==='ADVISOR'||role==='RESEARCH_ADVISOR'){
   const c=counts.advisor||{};
   setMenuTaskCount_('งานของฉัน',c.groups,'กลุ่มที่มีหัวข้อหรือรายงานรอตรวจ '+(c.groups||0)+' กลุ่ม');
   setMenuTaskCount_('กลุ่มที่ปรึกษา',c.groups,'กลุ่มที่มีหัวข้อหรือรายงานรอตรวจ '+(c.groups||0)+' กลุ่ม');
   setMenuTaskCount_('การประเมิน',c.a4,'กลุ่มที่ยังประเมิน A4 ไม่ครบ '+(c.a4||0)+' กลุ่ม');
  }else if(role==='STUDENT'){
   const c=counts.student||{};
   setMenuTaskCount_('รายงานความก้าวหน้า',c.progress,'รายงานความก้าวหน้าที่ต้องส่งหรือแก้ไข '+(c.progress||0)+' สัปดาห์');
   setMenuTaskCount_('ความก้าวหน้า',c.progress,'รายงานความก้าวหน้าที่ต้องส่งหรือแก้ไข '+(c.progress||0)+' สัปดาห์');
   setMenuTaskCount_('งานกลุ่ม',c.taskBoard,'งานกลุ่มที่ยังไม่เสร็จและเกี่ยวข้องกับบัญชีนี้ '+(c.taskBoard||0)+' รายการ');
   setMenuTaskTaskCountAlias_('หัวข้อวิจัย',c.topics,'หัวข้อวิจัยที่อาจารย์ส่งกลับให้แก้ไข '+(c.topics||0)+' รายการ');
   setMenuTaskTaskCountAlias_('เสนอชื่อเรื่องงานวิจัย',c.topics,'หัวข้อวิจัยที่อาจารย์ส่งกลับให้แก้ไข '+(c.topics||0)+' รายการ');
   setMenuTaskTaskCountAlias_('ประเมินเพื่อน',c.peerAssessment,'สมาชิกที่ยังต้องประเมิน A5 '+(c.peerAssessment||0)+' คน');
   setMenuTaskTaskCountAlias_('ประเมินเพื่อน A5',c.peerAssessment,'สมาชิกที่ยังต้องประเมิน A5 '+(c.peerAssessment||0)+' คน');
  }
 }catch(e){console.warn('โหลดจำนวนงานค้างของเมนูไม่สำเร็จ',e);}
}
function setMenuTaskTaskCountAlias_(label,count,description){setMenuTaskCount_(label,count,description);}
function renderDashboard(d){
  $('sideMenu').innerHTML='';
  d.menu.forEach((label,i)=>{
    const b=document.createElement('button');b.className='menu-item'+(i===0?' active':'');b.dataset.menuLabel=label;b.textContent=label;
    b.addEventListener('click',()=>{
      const requestId=++activeMenuRequestId;
      document.querySelectorAll('.menu-item').forEach(x=>x.classList.remove('active'));b.classList.add('active');
      saveActiveMenu(label);
      const routeLabel=normalizeMenuLabel_(label);
      const advisorRole=currentDashboard.user.roleId==='ADVISOR'||currentDashboard.user.roleId==='RESEARCH_ADVISOR';
      const advisorFallback=advisorRole?['overview','tasks','groups','meetings','a4'][i]:'';
      const isMeetingPage=routeLabel==='บันทึกการเข้าพบที่ปรึกษา'||routeLabel==='บันทึกการเข้าพบ'||routeLabel==='บันทึกการพบอาจารย์'||advisorFallback==='meetings';
      $('sectionTitle').textContent=isMeetingPage?'':label;$('sectionText').textContent='กำลังโหลดข้อมูล...';
      menuRenderQueue=menuRenderQueue.catch(()=>{}).then(async()=>{
        if(requestId!==activeMenuRequestId)return;
        try{
      if(advisorRole && routeLabel==='ภาพรวม') await renderAdvisorOverview();
      else if(advisorRole && routeLabel==='งานของฉัน') await renderAdvisorReview();
      else if(advisorRole && routeLabel==='กลุ่มที่ปรึกษา') await renderAdvisorGroups();
      else if(advisorRole && routeLabel==='การให้คำปรึกษ') await renderMeetingAttendance();
      else if(advisorRole && routeLabel==='การประเมิน') await renderAdvisorA4();
      else if(routeLabel==='บัญชีผู้ใช้' && currentDashboard.user.roleId==='ADMIN') await renderUserAdmin();
      else if(routeLabel==='นำเข้ารายชื่อนักศึกษา' && currentDashboard.user.roleId==='ADMIN') await renderExcelImport();
      else if(routeLabel==='บันทึกระบบ' && currentDashboard.user.roleId==='ADMIN') await renderAuditLog();
      else if(routeLabel==='จัดการกลุ่มวิจัย' && currentDashboard.user.roleId==='ADMIN') await renderGroupAdmin();
      else if(routeLabel==='กำหนดอาจารย์ที่ปรึกษา' && currentDashboard.user.roleId==='ADMIN') await renderAdvisorAssignment();
      else if(routeLabel==='บันทึกการเข้าพบที่ปรึกษา' || routeLabel==='บันทึกการเข้าพบ' || routeLabel==='บันทึกการพบอาจารย์' || advisorFallback==='meetings') await renderMeetingAttendance();
      else if(routeLabel==='จัดการรายงานความก้าวหน้า' && currentDashboard.user.roleId==='ADMIN') await renderAdminProgressManagement();
      else if(routeLabel==='จัดการงานกลุ่ม' && currentDashboard.user.roleId==='ADMIN') await renderAdminTaskBoard();
      else if(routeLabel==='ติดตามจริยธรรม' && currentDashboard.user.roleId==='ADMIN') await renderAdminEthicsTracking();
      else if(routeLabel==='สัญญาณเตือนความเสี่ยง' && currentDashboard.user.roleId==='ADMIN') await renderAdminEarlyWarnings();
      else if(routeLabel==='งานกลุ่ม') await renderRoleTaskBoard();
      else if(routeLabel==='ประเมินผล A1–A6' && currentDashboard.user.roleId==='ADMIN') await renderAssessmentAdmin();
      else if(routeLabel==='ประเมิน A4' || advisorFallback==='a4') await renderAdvisorA4();
      else if(routeLabel==='ประเมินเพื่อน A5' || routeLabel==='ประเมินเพื่อน') await renderPeerAssessment();
      else if(routeLabel==='การตั้งค่าระบบ' && currentDashboard.user.roleId==='ADMIN') await renderSystemSettings();
      else if(routeLabel==='กลุ่มที่ได้รับมอบหมาย' || advisorFallback==='groups') await renderAdvisorGroups();
      else if(routeLabel==='ข้อมูลของกลุ่ม') await renderStudentWorkspace();
      else if(routeLabel==='หัวข้อวิจัย' || routeLabel==='เสนอชื่อเรื่องงานวิจัย') await renderStudentTopics();
      else if(routeLabel==='เอกสารโครงร่าง') await renderProposalDocuments();
      else if(routeLabel==='ความก้าวหน้า' || routeLabel==='รายงานความก้าวหน้า') await renderProgressReports();
      else if(routeLabel==='ข้อเสนอแนะ') await renderFeedback();
      else if(routeLabel==='ผลการประเมิน' && currentDashboard.user.roleId==='STUDENT') await renderStudentGrades();
      else if(routeLabel==='ตรวจหัวข้อและให้ข้อเสนอแนะ') await renderAdvisorReview();
      else if(routeLabel==='ภาพรวมระบบ' || routeLabel==='ภาพรวมการให้คำปรึกษ' || advisorFallback==='overview') await renderOverview();
      else $('sectionText').textContent='เมนูนี้ยังไม่มีสิทธิ์หรือไม่มีข้อมูลสำหรับบัญชีนี้';

        }catch(err){
          if(requestId===activeMenuRequestId)$('sectionText').textContent='โหลดเมนูไม่สำเร็จ: '+(err&&err.message?err.message:String(err));
        }
      });
    });

  if(d.ethicsSummary){const ethics=el('div',{className:'notice'});ethics.append(el('h3',{},'สรุปแผนจริยธรรมการวิจัย (อ่านอย่างเดียว)'),el('p',{},'แผน: '+({DURING_COURSE:'ยื่นระหว่างรายวิชา',AFTER_COURSE:'ยื่นหลังรายวิชา',NOT_APPLICABLE:'ไม่เกี่ยวข้อง',UNDECIDED:'ยังไม่กำหนด'}[d.ethicsSummary.plan]||'ยังไม่มีข้อมูล')),el('p',{},'สถานะการยื่น: '+(d.ethicsSummary.submissionStatus||'—')+' · ผล REC: '+(d.ethicsSummary.approvalStatus||'—')));ethics.append(el('p',{},'การดำเนินงานในรายวิชาไม่ถือเป็นการรับรองจาก REC และห้ามเริ่มเก็บข้อมูลจากมนุษย์ก่อนการรับรองที่เกี่ยวข้อง'));a.append(ethics);}
 }catch(e){a.textContent='โหลดข้อมูลของกลุ่มไม่สำเร็จ: '+e.message;}
}

// Password panel supports both forced first-login change and voluntary change from Dashboard.
const changePasswordShortcut=$('changePasswordBtn');
if(changePasswordShortcut) changePasswordShortcut.addEventListener('click',()=>{
  $('passwordChangePanel').classList.remove('hidden');
  $('passwordChangeTitle').textContent='เปลี่ยนรหัสผ่าน';
  $('passwordChangeNotice').textContent='กรอกรหัสผ่านปัจจุบันและกำหนดรหัสผ่านใหม่';
  $('cancelPasswordChangeBtn').classList.remove('hidden');
  $('passwordChangePanel').scrollIntoView({behavior:'smooth',block:'center'});
});
const cancelPasswordChangeBtn=$('cancelPasswordChangeBtn');
if(cancelPasswordChangeBtn) cancelPasswordChangeBtn.addEventListener('click',()=>{
  $('passwordChangeForm').reset(); $('passwordMessage').textContent='';
  $('passwordChangePanel').classList.add('hidden');
});
async function submitPasswordChange(event){
  event.preventDefault(); event.stopPropagation();
  const form=$('passwordChangeForm'), btn=$('saveNewPasswordBtn'), msg=$('passwordMessage');
  const current=$('currentPassword').value, next=$('newPassword').value, confirmValue=$('confirmPassword').value;
  msg.textContent='';msg.className='message';
  if(!current||!next||!confirmValue){msg.textContent='กรุณากรอกข้อมูลให้ครบทุกช่อง';msg.className='message error';return;}
  if(next.length<6||!/[\p{L}]/u.test(next)||!/[0-9]/.test(next)||! /[^\p{L}0-9]/u.test(next)){msg.textContent='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร และประกอบด้วยตัวอักษร ตัวเลข และอักขระพิเศษ';msg.className='message error';return;}
  if(next!==confirmValue){msg.textContent='รหัสผ่านใหม่ไม่ตรงกัน';msg.className='message error';return;}
  setBusy(form,true);btn.textContent='กำลังบันทึกรหัสผ่าน...';msg.textContent='กำลังตรวจสอบและบันทึกรหัสผ่าน...';
  try{
    const result=await callApi('apiChangePassword',sessionToken,current,next);
    if(!result||result.ok!==true||result.passwordChangeRequired!==false)throw new Error((result&&result.message)||'เซิร์ฟเวอร์ยังไม่ยืนยันการบันทึก');
    msg.textContent='บันทึกรหัสผ่านใหม่สำเร็จ';msg.className='message success';
    showOperationStatus('สำเร็จ: บันทึกรหัสผ่านใหม่แล้ว');
    $('passwordChangeForm').reset();
    try{
      const fresh=await callApi('apiGetDashboard',sessionToken);
      if(fresh.forcePasswordChange===true)throw new Error('บัญชียังมีสถานะบังคับเปลี่ยนรหัสผ่าน');
      currentDashboard=fresh;$('passwordChangePanel').classList.add('hidden');$('dashboardLayout').classList.remove('hidden');
      $('changePasswordBtn').classList.remove('hidden');renderDashboard(fresh);
      showOperationStatus('สำเร็จ: เปลี่ยนรหัสผ่านและเปิด Dashboard แล้ว');
    }catch(refreshErr){
      msg.textContent='บันทึกรหัสผ่านสำเร็จ แต่โหลด Dashboard ไม่สำเร็จ: '+refreshErr.message+' กรุณาออกจากระบบแล้วเข้าสู่ระบบใหม่ด้วยรหัสผ่านใหม่';
      msg.className='message success';showOperationStatus('บันทึกรหัสผ่านแล้ว แต่โหลด Dashboard ไม่สำเร็จ',true);
    }
  }catch(err){msg.textContent='บันทึกรหัสผ่านไม่สำเร็จ: '+err.message;msg.className='message error';showOperationStatus('ไม่สำเร็จ: '+err.message,true);}
  finally{setBusy(form,false);btn.textContent='บันทึกรหัสผ่านใหม่';}
}
const passwordChangeForm=$('passwordChangeForm');
if(passwordChangeForm)passwordChangeForm.addEventListener('submit',submitPasswordChange);
if(window.SSRL_MAGIC_SESSION){sessionToken=window.SSRL_MAGIC_SESSION;storeSessionToken(sessionToken);loadDashboard(undefined,true);}
else if(sessionToken){
  let savedExpiry='';
  try{savedExpiry=localStorage.getItem('ssrl_expires_at')||sessionStorage.getItem('ssrl_expires_at')||'';}catch(e){}
  if(savedExpiry && Date.parse(savedExpiry)<=Date.now()) handleInvalidSession('Session หมดอายุ');
  else {if(savedExpiry)scheduleSessionExpiry(savedExpiry);loadDashboard(undefined,true);}
}
</script>
